name: Update Schedule ICS

on:
  schedule:
    # Запускать каждый час (в 0 минут). Время в UTC!
    - cron: '0 * * * *'
  workflow_dispatch: # Позволяет запустить вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем права на коммит файла обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        run: python parser.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.ics
          # Если файл не изменился, коммита не будет (защита от ошибок)
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update schedule.ics"
            git push
          fi